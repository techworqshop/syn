# Dependabot — automatisches Dep-Updates fuer Security + Versionsdrift
# Docs: https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  # npm packages (app/)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Security-Updates kommen sofort, nicht nur am Montag
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
      major:
        update-types:
          - "major"

  # Docker base image (app/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions (falls vorhanden)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
